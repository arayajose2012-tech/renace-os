# Renace OS — arranque pensado para Macs
---
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelName: "vmlinuz"
kernelParams: [ "quiet" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

efiBootloaderId: "debian"

# El firmware de Apple suele ignorar las entradas de arranque de la NVRAM:
# copiar GRUB también a EFI/BOOT/ para que el Mac lo encuentre siempre.
installEFIFallback: true
